[package]
name = "oura-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
reqwest = { version = "0.11.24", features = ["blocking", "json"] }
confy = "0.6.1"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.121"
chrono = "0.4.38"

[dev-dependencies]
mockall = "0.12.1"
tempfile = "3.10.0"
assert_cmd = "2.0.13"
predicates = "3.1.0"
wiremock = "0.5.22"
tokio = { version = "1.36.0", features = ["full"] }
futures = "0.3.30"
